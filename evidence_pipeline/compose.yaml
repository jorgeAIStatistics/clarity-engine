# Run from clarity-engine: docker compose --env-file evidence_pipeline/.env -f evidence_pipeline/compose.yaml up --build
services:
  api:
    build:
      context: ..
      dockerfile: evidence_pipeline/Dockerfile
    env_file: .env
    environment:
      PIPELINE_STATE_PATH: /state/pico.sqlite3
    command: ["uvicorn", "evidence_pipeline.api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["pipeline-state:/state"]
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: evidence_pipeline/Dockerfile
    env_file: .env
    environment:
      PIPELINE_STATE_PATH: /state/pico.sqlite3
    volumes: ["pipeline-state:/state"]
    restart: unless-stopped
volumes:
  pipeline-state:

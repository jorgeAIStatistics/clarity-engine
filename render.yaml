# Clarity production Blueprint.
# Public launch defaults: non-sleeping web service + persistent paid Postgres.
services:
  - type: web
    name: clarity-engine-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    # One API process preserves rate counters; the supervisor also runs the
    # bounded scheduler against persistent PostgreSQL.
    startCommand: python production.py
    envVars:
      - key: CLARITY_ALLOW_LIVE_GENERATION
        value: "0"              # launch serves audited, pre-generated profiles only
      - key: CLARITY_DAILY_CAP
        value: "20"
      - key: CLARITY_IP_INTERVAL
        value: "3.0"
      - key: CLARITY_ASK_IP_INTERVAL
        value: "0.35"
      - key: CLARITY_ENGINE_VERSION
        value: "2026.09-launch.2"
      - key: CLARITY_STORE_ASK_TEXT
        value: "0"
      - key: CLARITY_ASK_HASH_SALT
        generateValue: true
      # Required launch configuration. Render prompts for these values instead
      # of committing them to the repository.
      - key: CLARITY_CONTACT_EMAIL
        sync: false
      - key: CLARITY_ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLARITY_ASK_MODEL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: clarity-db
          property: connectionString

databases:
  - name: clarity-db
    plan: 0.5c-1g
    databaseName: clarity
    user: clarity
